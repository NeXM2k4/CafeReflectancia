[theme]
# Tema claro (fondo blanco) desde 2026-11-16, a pedido del equipo.
base = "light"
# Acento neutro: los colores con significado (tipo de hoja, especie, similitud) quedan
# reservados a los datos y nunca se reutilizan para botones o controles.
primaryColor = "#2B2C2A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F1"
textColor = "#1F201E"
borderColor = "#DAD9D3"
dataframeBorderColor = "#E6E5E0"
dataframeHeaderBackgroundColor = "#F4F4F1"
showWidgetBorder = true
showSidebarBorder = true
linkColor = "#1F5FAD"
linkUnderline = false
baseRadius = "6px"
buttonRadius = "6px"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["1.9rem", "1.35rem", "1.1rem", "1rem", "0.95rem", "0.9rem"]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 500
codeBackgroundColor = "#F4F4F1"
codeTextColor = "#3A3B38"
chartCategoricalColors = ["#3987E5", "#D95926", "#199E70", "#B97A00", "#D55181", "#008300", "#9085E9", "#E66767"]

[theme.sidebar]
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#EDEDE9"

[global]
# Las pestañas perezosas de *Evolución temporal* conservan el estado de sus controles
# reasignándolo (`ui.keep_widget_state`); Streamlit lo anota en el log con una traza aunque es el
# patrón que documenta. Ver docs/plan_rendimiento.md.
disableWidgetStateDuplicationWarning = true

[client]
toolbarMode = "minimal"
showErrorDetails = "full"

[server]
runOnSave = false
